# Phase 2 held-out set — DRAFT for user approval (drafted by the independent reviewer 2026-10-16)
# Purpose: Phase 2 exit check only (Playbook 0.2 §5, §6 item 2). Never used for development, debugging, prompts,
# replay seeds or dev logs. Run once at exit (6 cases x 3 runs); afterwards the set counts as exposed.
# Storage: this text lives only in the Claude project (reviewer + user). The repository gets a commitment file with
# one SHA-256 per case document (UTF-8, LF, exactly as written between the --- separators) plus the whole-file SHA.
# Dates: {DATE} is filled at exit time with the first listed weekday that is 7-14 days after the checkpoint starts,
# written as "Wednesday, November 18" (content) and ISO (Gold). Filling the date is the only permitted change.
# Places: none of these places or cuisines was a request location or HARD cuisine in Phase 1, P1-D probes or P2-1.
# Each case has one fallback place, used only if the main place fails witness certification at exit.
# Radius: named places 1,000 m (Google named-place resolution, witnesses within 800 m). Tokyo only.

---
id: p2-holdout-01
weekday: Wednesday
fallback_place: Asakusabashi
content: |
  Can you find a yakitori place near Ueno with a table for 3 on {DATE} at 7 PM?
semantic:
  target:
    goal: "AVAILABILITY"
  location:
    value: "Ueno"
    relation: "NEAR"
  date:
    expression: "{DATE}"
  time:
    value: "19:00"
  party_size: 3
  criteria:
    - value: "yakitori"
      polarity: POSITIVE
      strength: HARD
acceptance:
  required_claims:
    - Correct outlet within 1,000 m of the resolved Ueno point; source-supported yakitori; a matching current slot on {DATE} at 19:00 for 3.

