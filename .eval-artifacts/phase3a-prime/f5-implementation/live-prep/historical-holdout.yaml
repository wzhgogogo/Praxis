# Phase 2c held-out set (draft rev 2, reviewer-authored 2026-10-23). Exit check only; never used for development, prompts,
# replay seeds or dev logs. 6 cases x 3 runs. Text lives only in the Claude project until the exit check; the repository
# receives SHA-256 commitments (one per case document between the --- separators, UTF-8, LF, plus the whole file).
# Dates: {DATE} is filled at exit time with the case weekday 7-14 days after the exit check starts. Filling the date,
# and switching to the listed fallback place if witness certification fails, are the only permitted changes.
# Places and cuisines: none was a request location, fallback place or HARD/NEGATIVE criterion in any earlier case
# (Phase 0 seeds, Phase 1, Phase 2 development, probes, the first Phase 2 and the Phase 2b held-out sets); some place
# names occur only inside saved third-party pages. All strings are quoted on purpose.

---
id: "p2c-holdout-01"
weekday: "Wednesday"
fallback_place: "Jujo"
content: |
  Could you find a kushikatsu place near Akabane with a table for 2 on {DATE} at 7 PM?
semantic:
  target:
    goal: "AVAILABILITY"
  location:
    value: "Akabane"
    relation: "NEAR"
  date:
    expression: "{DATE}"
  time:
    value: "19:00"
  party_size: 2
  criteria:
    - value: "kushikatsu"
      polarity: "POSITIVE"
      strength: "HARD"
acceptance:
  required_claims:
    - "Correct outlet within 1,000 m of the resolved Akabane point; source-supported kushikatsu (kushiage); a matching current slot on {DATE} at 19:00 for 2."

