# Phase 2b held-out set (draft, reviewer-authored 2026-10-22). Exit check only; never used for development, prompts,
# replay seeds or dev logs. 6 cases x 3 runs. Text lives only in the Claude project until the exit check; the repository
# receives SHA-256 commitments (one per case document between the --- separators, UTF-8, LF, plus the whole file).
# Dates: {DATE} is filled at exit time with the case weekday 7-14 days after the exit check starts. Filling the date,
# and switching to the listed fallback place if witness certification fails, are the only permitted changes.
# Places and cuisines: none was a request location, fallback place or HARD cuisine in Phase 1, Phase 2 development,
# probes, the name-resolution benchmark or the first Phase 2 held-out set. All strings are quoted on purpose.

---
id: "p2b-holdout-01"
weekday: "Wednesday"
fallback_place: "Kuramae"
content: |
  Could you find a sukiyaki restaurant near Asakusa with a table for 2 on {DATE} at 7 PM?
semantic:
  target:
    goal: "AVAILABILITY"
  location:
    value: "Asakusa"
    relation: "NEAR"
  date:
    expression: "{DATE}"
  time:
    value: "19:00"
  party_size: 2
  criteria:
    - value: "sukiyaki"
      polarity: "POSITIVE"
      strength: "HARD"
acceptance:
  required_claims:
    - "Correct outlet within 1,000 m of the resolved Asakusa point; source-supported sukiyaki; a matching current slot on {DATE} at 19:00 for 2."

